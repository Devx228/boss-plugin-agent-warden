name: Release

# Attaches a built jar to a GitHub Release when a version tag is pushed, so the
# plugin can be installed through Toolbox's "From File" or from a release URL.
#
# This is not store publication and does not pretend to be. That needs credentials
# held by BossConsole maintainers, and the contributor guide is explicit that
# copying the org's release workflow into a personal repository does not grant
# them. Nothing here uses a secret.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # A tag that cannot pass its own tests should not become a release.
      - name: Test
        run: ./gradlew test --no-daemon

      - name: Build the plugin jar
        run: ./gradlew buildPluginJar --no-daemon

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/*.jar
          generate_release_notes: true
